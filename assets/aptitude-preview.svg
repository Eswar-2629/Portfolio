  <text x="1080" y="95" fill="#f39a72" font-family="Arial, sans-serif" font-size="18" text-anchor="end">ILLUSTRATIVE PREVIEW</text>
  <rect x="82" y="162" width="220" height="430" rx="10" fill="#f4f7f5" stroke="#d7e0dc"/>
  <text x="108" y="202" fill="#202b2b" font-family="Arial, sans-serif" font-size="18" font-weight="700">Practice areas</text>
