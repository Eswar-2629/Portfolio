<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Gamified aptitude test interface</title>
  <desc id="desc">Illustrative interface preview based on the repository, showing aptitude categories, a timed question, and score progress.</desc>
  <rect width="1200" height="675" fill="#edf4f0"/>
  <rect x="48" y="48" width="1104" height="579" rx="18" fill="#ffffff" stroke="#b9cac4" stroke-width="2"/>
