  <text x="372" y="282" fill="#202b2b" font-family="Arial, sans-serif" font-size="25" font-weight="700">Choose the next value in the series</text>
  <text x="372" y="323" fill="#426b63" font-family="Georgia, serif" font-size="22">2, 6, 12, 20, ?</text>
